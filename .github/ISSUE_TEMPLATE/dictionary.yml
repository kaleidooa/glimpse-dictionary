name: Dictionary correction
description: Report a missing word or an incorrect Korean definition.
body:
  - type: input
    id: word
    attributes:
      label: English word
    validations:
      required: true
  - type: textarea
    id: meaning
    attributes:
      label: Current and suggested meaning
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Reference
      description: Link to a source we can legally redistribute, or explain your original correction.
