name: Bug report
description: Report a problem with lookup, shortcuts, scrolling or saved words.
body:
  - type: input
    id: version
    attributes:
      label: Glimpse version
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A small public example helps. Private URLs or browsing content are not needed.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
