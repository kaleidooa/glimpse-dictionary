<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Glimpse · Dictionary</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <b>glimpse<span>.</span></b>
      <div>
        <button id="words" data-en="My words" data-ko="단어장">My words</button>
        <button id="settings" data-en="Settings" data-ko="설정">
          Settings
        </button>
      </div>
    </header>
    <main>
      <h1
        data-en="Look up a word. Keep reading."
        data-ko="읽던 자리에서, 바로."
      >
        Look up a word. Keep reading.
      </h1>
      <p class="lead">
        <span data-en="Point at a word and press" data-ko="단어에 커서를 두고"
          >Point at a word and press</span
        >
        <kbd id="shortcut">…</kbd>
        <button
          id="shortcut-change"
          data-en="Change shortcut ↗"
          data-ko="단축키 변경 ↗"
        >
          Change shortcut ↗
        </button>
      </p>
      <p
        class="selection-tip"
        data-en="Or select text: the book icon looks up a word; the translation icon translates a sentence."
        data-ko="드래그 후 책 아이콘은 단어 뜻을, 번역 아이콘은 문장 번역을 보여줍니다."
      >
        Or select text: the book icon looks up a word; the translation icon
        translates a sentence.
      </p>
      <section class="site-card">
        <div
          class="section-label"
          data-en="Current site"
          data-ko="지금 읽는 사이트"
        >
          Current site
        </div>
        <strong id="site">…</strong>
        <p id="site-state"></p>
        <button
          class="primary"
          id="once"
          data-en="Use on this tab"
          data-ko="이번 탭에서 사용"
          disabled
        >
          Use on this tab
        </button>
        <button id="site-enable" disabled>Always use on this site</button>
        <button
          id="site-disable"
          class="quiet"
          data-en="Disable automatic use here"
          data-ko="이 사이트 자동 사용 해제"
          hidden
        >
          Disable automatic use here
        </button>
      </section>
      <div id="status" role="status" aria-live="polite"></div>
      <section class="dictionary-info">
        <div class="dictionary-heading">
          <h2 data-en="Look up a word" data-ko="단어로 바로 확인">
            Look up a word
          </h2>
          <span data-en="EN → KO · Offline" data-ko="영한 · 오프라인"
            >EN → KO · Offline</span
          >
        </div>
        <form id="dictionary-form">
          <label
            class="sr-only"
            for="dictionary-word"
            data-en="English word"
            data-ko="조회할 영어 단어"
            >English word</label
          >
          <div class="dictionary-search">
            <input
              id="dictionary-word"
              type="text"
              placeholder="serendipity"
              maxlength="80"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="submit" data-en="Look up" data-ko="조회">
              Look up
            </button>
          </div>
        </form>
        <div id="dictionary-result" role="status" aria-live="polite"></div>
      </section>
      <label class="language-picker"
        ><span data-en="Language" data-ko="언어">Language</span>
        <select id="language" aria-label="Language">
          <option value="en">English</option>
          <option value="ko">한국어</option>
        </select>
      </label>
      <footer>
        <button id="help" data-en="Getting started" data-ko="처음 사용하기">
          Getting started
        </button>
        <button id="privacy" data-en="Privacy" data-ko="개인정보·출처">
          Privacy</button
        ><span id="version"></span>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
